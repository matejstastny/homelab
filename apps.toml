[[app]]
name = "ytdl"
label = "youtube downloader"
host = "io"
domain = "yt.elara.boo"
api = 8090
web = 4321
needs = "yt-dlp and ffmpeg to download media"

[app.env]
YTDL_CACHE_DIR = "/tmp/rpi-ytdl/cache"
YTDL_VIDEO_DIR = "/tmp/rpi-ytdl/video"
YTDL_AUDIO_DIR = "/tmp/rpi-ytdl/audio"

[[app]]
name = "share"
label = "quick share"
host = "io"
domain = "share.elara.boo"
api = 8091
web = 4322

[app.env]
SHARE_DIR = "/tmp/rpi-share"

[[app]]
name = "dash"
label = "fleet dashboard"
host = "io"
domain = "dash.elara.boo"
api = 8092
web = 4323
needs = "VictoriaMetrics, Transmission, Jellyfin and Tailscale for live data"

[app.env]
DASH_CATALOG = "./catalog.json"

[[app.files]]
from = "server/catalog.json"
as = "dash-catalog.json"

[[app]]
name = "torrent"
label = "transmission ui"
host = "io"
domain = "torrent.elara.boo"
api = 8093
web = 4324
needs = "Transmission RPC for live data"

[[app]]
name = "tasks"
label = "weekly planner"
host = "io"
domain = "tasks.elara.boo"
api = 8094
web = 4325

[app.env]
TASKS_DIR = "/tmp/rpi-tasks"
TASKS_TZ = "America/Los_Angeles"
