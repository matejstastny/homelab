zone = "elara.boo"

user = "elara"
port = 3000

bootstrap = ["9.9.9.10", "149.112.112.10", "2620:fe::10", "2620:fe::fe:10"]

[records]
dns = "thebe"
ntfy = "thebe"
jellyfin = "io"

# names answered with an address written out here instead of a fleet host.
# these are off the tailnet, so there is nothing to look up; only boxes with a
# route to the subnet can actually connect once the name resolves
[addresses]
router = "192.168.8.1"

[resolvers]
thebe = [
    "https://dns10.quad9.net/dns-query",
    "https://cloudflare-dns.com/dns-query",
    "https://dns.mullvad.net/dns-query",
]
leda = ["https://dns10.quad9.net/dns-query"]
